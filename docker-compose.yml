services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_secret_password
      POSTGRES_DB: split_tender_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d split_tender_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api_blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swipe_savvy_api_blue
    restart: unless-stopped
    environment:
      PORT: 3000
      DEPLOYMENT_COLOR: blue
      DATABASE_URL: postgres://ledger_user:ledger_secret_password@postgres:5432/split_tender_ledger
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

  api_green:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swipe_savvy_api_green
    restart: unless-stopped
    environment:
      PORT: 3000
      DEPLOYMENT_COLOR: green
      DATABASE_URL: postgres://ledger_user:ledger_secret_password@postgres:5432/split_tender_ledger
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    container_name: swipe_savvy_frontend
    restart: unless-stopped
    depends_on:
      - api_blue
      - api_green

  nginx:
    image: nginx:1.27-alpine
    container_name: swipe_savvy_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf
    depends_on:
      api_blue:
        condition: service_healthy
      api_green:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data: